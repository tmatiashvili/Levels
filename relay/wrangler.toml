# Levels push relay (ADR-0023, PUSH-001). Not deployed yet: it needs the paid
# Apple Developer Program for the APNs keys and App Attest (owner decision U).
# Owner setup steps are in docs/specs/PUSH-001-push-widget-updates.md.

name = "levels-push-relay"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

# Keep request logging off: logs could hold subrequest URLs, and APNs URLs
# contain device tokens (PUSH-001 R63).
[observability]
enabled = false

[vars]
# Placeholders until enrollment (owner decision B).
IOS_BUNDLE_ID = "com.tmatiashvili.levels"
APPLE_TEAM_ID = "TEAMID0000"
APNS_KEY_ID_SANDBOX = ""
APNS_KEY_ID_PRODUCTION = ""

# Secrets, set with `wrangler secret put <NAME>` (never in this file):
#   APNS_KEY_SANDBOX        contents of the sandbox AuthKey_<KEYID>.p8
#   APNS_KEY_PRODUCTION     contents of the production AuthKey_<KEYID>.p8
#   RELAY_HMAC_KEY          `openssl rand -base64 32`
#   RELAY_HMAC_KEY_PREVIOUS only during a key rotation

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiterObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiterObject"]
